name: Testes da API e PostgreSQL
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: vivamente_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d vivamente_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci_only@127.0.0.1:5432/vivamente_ci
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-hosted.txt
      - run: python tests/postgres_integration.py
