const card=(name,value)=>'<div class="card"><small>'+esc(name)+'</small><strong>'+esc(value)+'</strong></div>';
const table=(headers,rows)=>'<div class="scroll"><table><thead><tr>'+headers.map(h=>'<th>'+esc(h)+'</th>').join("")+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join("")+'</tr>').join("")+(rows.length?'':'<tr><td colspan="'+headers.length+'">Nenhum registro.</td></tr>')+'</tbody></table></div>';
function pagedTable(headers,rows,key,pages){
 if(!pages||rows.length<=15)return table(headers,rows);
 const offset=(pages[key]||0)*15;
 return table(headers,rows.slice(offset,offset+15))+'<div class="page-controls no-print"><span>'+ (offset+1)+'–'+Math.min(offset+15,rows.length)+' de '+rows.length+'</span><div><button data-page="'+key+'" data-dir="-1" '+(!offset?"disabled":"")+'>Anterior</button> <button data-page="'+key+'" data-dir="1" '+(offset+15>=rows.length?"disabled":"")+'>Próxima</button></div></div>';
}
function bindPages(target,pages,draw){
 target.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{
  const {page:key,dir}=b.dataset;
  pages[key]=(pages[key]||0)+Number(dir);draw();
  const buttons=[...target.querySelectorAll("[data-page]")].filter(x=>x.dataset.page===key);
  (buttons.find(x=>!x.disabled&&x.dataset.dir===dir)||buttons.find(x=>!x.disabled))?.focus();
 });
}

async function api(path,body){
 if(body)throw Error("Esta prévia usa dados fictícios para visualização. Use o pacote de desenvolvimento para gravar alterações.");
 const url=new URL(path,"https://preview.invalid"), q=url.searchParams;
 const matches=row=>(!q.get("medico")||row.medico===q.get("medico"))&&(!q.get("inicio")||row.data>=q.get("inicio"))&&(!q.get("fim")||row.data<=q.get("fim"));
 if(url.pathname==="/cadastros")return fixture.cadastros;
 if(url.pathname==="/lancamentos")return fixture.report.linhas.filter(matches).slice().reverse().map(r=>({...r,editavel:false}));
 if(url.pathname==="/cotacao"){
  const t=fixture.cadastros.Tarifas.find(x=>x.especialidade===q.get("especialidade")&&x.modalidade===q.get("modalidade"));
  if(!t)throw Error("Cadastre a tarifa da especialidade e modalidade.");
  return {unitario:t.unitario};
 }
 if(url.pathname!=="/painel"&&url.pathname!=="/relatorio")throw Error("Disponível no pacote de desenvolvimento.");
 const linhas=fixture.report.linhas.filter(matches), pagamentos=fixture.report.pagamentos.filter(matches);
 const contagem=Object.fromEntries(types.map(t=>[t,0])), ranking=Object.create(null), evolucao={};
 let total=0,repasse=0,clinica=0,qty=0;
 for(const r of linhas){
  contagem[r.tipo]+=r.quantidade; ranking[r.medico]=(ranking[r.medico]||0)+r.quantidade;
  qty+=r.quantidade; total+=r.valor;repasse+=r.repasse;clinica+=r.clinica;
  const m=r.data.slice(0,7), trend=evolucao[m]??=[0,0,0];
  trend[0]+=r.valor;trend[1]+=r.repasse;trend[2]+=r.clinica;
 }
 const media=qty?Math.round(total/qty):0;
 if(url.pathname==="/relatorio"){
  const fields=["data","paciente","modalidade_nome","tipo","servicos","quantidade","repasse"];
  const summaries=new Map();
  const details=linhas.map(r=>{
   const medico=nameOf("Medicos",r.medico);
   if(!summaries.has(r.medico))summaries.set(r.medico,{medico,quantidade:0,repasse:0,contagem:Object.fromEntries(types.map(t=>[t,0]))});
   const s=summaries.get(r.medico);s.quantidade+=r.quantidade;s.repasse+=r.repasse;s.contagem[r.tipo]+=r.quantidade;
   return {...Object.fromEntries(fields.map(k=>[k,r[k]])),medico};
  });
  return {medico:q.get("medico")?nameOf("Medicos",q.get("medico")):"",linhas:details,contagem,quantidade:qty,repasse,profissionais:[...summaries.values()]};
 }
 return {linhas,pagamentos,contagem,ranking:Object.entries(ranking).sort((a,b)=>b[1]-a[1]),evolucao,total,repasse,clinica,media,pago:pagamentos.reduce((n,r)=>n+r.valor,0)};
}

function graph(trend){
 const rows=Object.entries(trend);if(!rows.length)return '<p class="hint">Sem dados no período.</p>';
 const colors=["#087664","#4b73b7","#bd6941"], captions=["Bruto","Repasse","Parcela clínica"];
 const values=rows.flatMap(x=>x[1]), hi=Math.max(1,...values), lo=Math.min(0,...values);
 const x=i=>rows.length===1?400:70+i*680/(rows.length-1),y=v=>25+(hi-v)*145/(hi-lo);
 const guides=[hi,(hi+lo)/2,lo].map(v=>'<line x1="70" x2="750" y1="'+y(v)+'" y2="'+y(v)+'" stroke="#d4e2dd"/><text x="65" y="'+(y(v)+4)+'" text-anchor="end" font-size="10">'+esc(money(v))+'</text>').join("");
 const series=colors.map((c,j)=>'<polyline fill="none" stroke="'+c+'" stroke-width="2.5" points="'+rows.map((r,i)=>x(i)+','+y(r[1][j])).join(" ")+'"/>'+rows.map((r,i)=>'<circle cx="'+x(i)+'" cy="'+y(r[1][j])+'" r="3" fill="'+c+'"><title>'+esc(r[0]+" · "+captions[j]+" · "+money(r[1][j]))+'</title></circle>').join("")).join("");
 const labels=rows.map((r,i)=>i%Math.ceil(rows.length/7)===0?'<text x="'+x(i)+'" y="197" text-anchor="middle" font-size="11">'+esc(r[0])+'</text>':"").join("");
 return '<svg class="chart" viewBox="0 0 780 208" role="img" aria-label="Evolução financeira mensal">'+guides+series+labels+'</svg><div class="legend">'+colors.map((c,j)=>'<span style="--color:'+c+'">'+captions[j]+'</span>').join("")+'</div>';
}

async function resizePhoto(file){
 if(!["image/png","image/jpeg","image/webp"].includes(file.type)||file.size>8000000)throw Error("Escolha uma imagem JPEG, PNG ou WebP de até 8 MB.");
 const image=await createImageBitmap(file);
 try{
  const canvas=document.createElement("canvas");canvas.width=canvas.height=128;
  const side=Math.min(image.width,image.height);
  canvas.getContext("2d").drawImage(image,(image.width-side)/2,(image.height-side)/2,side,side,0,0,128,128);
  return canvas.toDataURL("image/jpeg",.72);
 }finally{image.close();}
}

function counts(lines,key,only){
 const totals=Object.create(null);
 for(const row of lines){
  if(only&&row.tipo!==only)continue;
  const k=key(row);
  totals[k]=(totals[k]||0)+row.quantidade;
 }
 return totals;
}
function monthSeries(lines,start,end){
 const count=counts(lines,r=>r.data.slice(0,7));
 const first=start.slice(0,7), last=end.slice(0,7), result=[];
 let [year,month]=first.split("-").map(Number);
 while(result.length<60){
  const key=year+"-"+String(month).padStart(2,"0");
  if(key>last)break;
  result.push([key,count[key]||0]);
  if(++month===13){month=1;year++;}
 }
 return result;
}

function barChart(series,evolution){
 const peak=Math.max(0,...series.map(x=>x[1]));
 const fmt=new Intl.DateTimeFormat("pt-BR",{month:"short",timeZone:"UTC"});
 const current=today().slice(0,7);
 return '<div class="chart-readout" id="chartReadout" aria-live="polite"></div><div class="chart-guide">'+a("imgLine11")+'<strong>'+number(peak)+'</strong></div>'+
 '<div class="monthly" role="group" aria-label="Quantidade de atendimentos por mês">'+series.map(([m,n])=>{
  const label=fmt.format(new Date(m+"-01T00:00:00Z")).replace(".","");
  const title=label+"/"+m.slice(0,4)+" · "+number(n)+" atendimentos · "+money(evolution[m]?.[0]||0)+" faturados";
  return '<button type="button" class="month" data-month="'+esc(title)+'" aria-label="'+esc(title)+'"'+(m===current?' aria-current="date"':'')+'><span class="bar '+(m===current?'current':'')+'" style="height:'+Math.round(100*n/(peak||1))+'%"></span><small>'+esc(label)+'</small></button>';
 }).join("")+'</div>';
}
function delta(current,previous){
 if(!previous)return "";
 const pct=(current-previous)*100/previous;
 const value=new Intl.NumberFormat("pt-BR",{maximumFractionDigits:2,signDisplay:"always"}).format(pct);
 return '<span class="trend-tag '+(pct<0?'down':'')+'" title="Comparação com o período anterior">'+a("imgArrowDropUp")+esc(value)+'%</span>';
}
function miniList(rows,free=false){
 const assets=[a("imgIcon"),'<span class="overlay">'+a("imgElectricCar")+'<span class="overlay">'+a(free?"imgGroup5":"imgGroup")+'</span></span>',a("imgIcon1"),a("imgIcon")];
 return rows.length?'<div class="mini-list">'+rows.map(([name,count],i)=>'<div class="mini-row '+(free&&i===1?'orange':'')+'"><span class="list-icon">'+(i%4===1?a("imgIconBackground"):"")+assets[i%4]+'</span><div><strong>'+esc(name)+'</strong><small>total</small></div><span class="row-value">'+number(count)+'</span></div>').join("")+'</div>':'<p class="dash-empty mini-list">Sem registros no período.</p>';
}
function dashboard(r,previous,showAll){
 const total=Object.values(r.contagem).reduce((sum,n)=>sum+n,0);
 const sameYear=filters.inicio.slice(0,4)===filters.fim.slice(0,4);
 const chartStart=sameYear?filters.inicio.slice(0,4)+"-01-01":filters.inicio;
 const chartEnd=sameYear?filters.fim.slice(0,4)+"-12-31":filters.fim;
 const monthly=monthSeries(r.linhas,chartStart,chartEnd).slice(-12);
 const privateMonthly=monthSeries(r.linhas.filter(x=>x.tipo==="Particular"),filters.inicio,filters.fim).slice(-7);
 const mini=monthSeries(r.linhas,filters.inicio,filters.fim).slice(-5);
 const max=Math.max(1,...privateMonthly.map(x=>x[1])), miniMax=Math.max(1,...mini.map(x=>x[1]));
 const insured=Object.entries(counts(r.linhas,x=>x.modalidade_nome,"Convênio")).sort((x,y)=>y[1]-x[1]);
 const list=showAll?r.ranking:r.ranking.slice(0,3);
 const avatars=["imgAvatar","imgAvatar1","imgAvatar2"];
 const ranks=list.map(([id,n],i)=>{
  const name=nameOf("Medicos",id), doctor=data.Medicos.find(d=>d.id===id), dates=r.linhas.filter(x=>x.medico===id);
  const last=dates.reduce((day,x)=>x.data>day?x.data:day,"");
  const initials=name.split(" ").slice(0,2).map(w=>w[0]).join("").toUpperCase();
  return '<button class="rank-row" data-doctor="'+esc(id)+'"><span class="avatar">'+(doctor?.foto?doctorPhoto(doctor):(["Marina Almeida","Rafael Nogueira","Bianca Castro"].includes(name))&&avatars[i]?a(avatars[i],"png").replace(' alt=""',' width="32" height="34" alt=""'):esc(initials))+'</span><span><strong>'+esc(name)+'</strong><small>'+esc(last?"Atualizado "+dateLabel(last):"")+'</small></span><span class="row-value">'+number(n)+'</span></button>';
 }).join("");
 const free=(r.contagem.Retorno||0)+(r.contagem.Cortesia||0);
 const pastFree=previous?(previous.Retorno||0)+(previous.Cortesia||0):null;
 const kpi=(label,value,graphic="",detail="")=>'<article class="dash-card dash-kpi">'+graphic+'<div class="kpi-text"><div class="dash-label">'+esc(label)+'</div><strong>'+esc(value)+'</strong></div>'+detail+'</article>';
 const people='<div class="kpi-icon">'+a("imgShadow")+'<div class="kpi-overlay"><div class="shape">'+a("imgIcon3")+["imgGroup1","imgGroup2","imgGroup3","imgGroup4"].map((name,i)=>'<span style="position:absolute;left:'+([18,7,20,2][i])+'px;top:'+([4,3,15,16][i])+'px">'+a(name)+'</span>').join("")+'</div></div></div>';
 const iconBox=name=>'<div class="kpi-icon">'+a(name)+'</div>';
 const spark='<div class="spark">'+a("imgGraph")+'</div>';
 const sparkMini='<div class="spark-mini" aria-hidden="true">'+mini.map(x=>'<span><i style="height:'+Math.round(x[1]*100/miniMax)+'%"></i></span>').join("")+'</div>';
 const bottom=(label,value,badge,body)=>'<section class="dash-card"><div class="dash-label bottom-label">'+esc(label)+'</div><div class="dash-number bottom-number">'+number(value)+'</div>'+badge+body+'</section>';
 return '<div class="dash-grid"><div class="dash-top">'+kpi("Atendimentos",number(total),people,spark)+kpi("Média por atendimento",money(r.media),"",sparkMini)+kpi("Repasse do período",money(r.repasse),iconBox("imgIcon2"))+kpi("Parcela da clínica",money(r.clinica),iconBox("imgIcon4"))+'</div>'+
 '<div class="dash-mid"><section class="dash-card"><div class="dash-label chart-title">Evolução mensal de atendimentos</div><div class="chart-value"><strong class="dash-number">'+number(total)+'</strong><span class="chart-caption">soma '+(filters.inicio.endsWith("-01-01")&&sameYear?"do ano até o momento":"do período")+'</span></div><div class="chart-icon">'+a("imgBarChart")+'</div>'+barChart(monthly,r.evolucao)+'</section>'+
 '<section class="dash-card rank-card"><h3>Ranking de atendimentos</h3><div class="rank-list">'+(ranks||'<p class="dash-empty">Sem atendimentos no período.</p>')+'</div>'+(r.ranking.length>3?'<div class="rank-footer"><button id="rankToggle">'+(showAll?'Ver menos':'Ver todos')+'<span class="rank-arrow">'+a("imgKeyboardBackspace")+'</span></button></div>':'')+'</section></div>'+
 '<div class="dash-bottom">'+bottom("Particulares",r.contagem.Particular,delta(r.contagem.Particular,previous?.Particular),'<div class="micro" aria-label="Particulares por mês">'+privateMonthly.map(([m,n])=>'<span title="'+esc(m+': '+number(n))+'"><i style="height:'+Math.round(n*100/max)+'%"></i></span>').join("")+'</div>')+
 bottom("Convenio",r.contagem["Convênio"],delta(r.contagem["Convênio"],previous?.["Convênio"]),miniList(insured))+
 bottom("Retorno / Cortesia",free,delta(free,pastFree),miniList([["Retorno",r.contagem.Retorno],["Cortesia",r.contagem.Cortesia]],true))+'</div></div>';
}


async function overview(){
 const selected=filters.medico;
 const start=filters.inicio||today().slice(0,4)+"-01-01", end=filters.fim||today();
 filters={...filters,inicio:start,fim:end};
 const dateField=(name,prefix,value)=>'<label>'+prefix+' <span>'+dateLabel(value)+'</span>'+input(name,value,"date","required aria-label="+(name==="inicio"?"Inicial":"Final"))+'</label>';
 page.innerHTML='<div class="dash-header"><div><span class="eyebrow">Bem vindo de volta</span><h2>'+esc(selected?nameOf("Medicos",selected):"Dashboard")+'</h2></div><form id="v2Filter" class="period no-print">'+
 input("medico",selected,"hidden")+dateField("inicio","de",start)+dateField("fim","à",end)+
 '<button type="submit">Aplicar</button></form></div>'+(selected?'<div class="profile-tools no-print"><button id="clearDoctor">← Visão geral</button> <button id="editProfile">Editar profissional</button></div>':'')+'<div id="overviewResult" aria-live="polite"><p class="dash-empty">Carregando dashboard…</p></div>';
 const target=$("overviewResult"), clear=$("clearDoctor");
 if(clear){clear.onclick=()=>openDoctor(""); $("editProfile").onclick=()=>{group="Medicos";navigate("Cadastros");catalog(data.Medicos.find(d=>d.id===selected));};}
 $("v2Filter").querySelectorAll('input[type="date"]').forEach(el=>{
  el.oninput=()=>{if(el.value)el.previousElementSibling.textContent=dateLabel(el.value);};
  el.onclick=()=>{try{el.showPicker?.();}catch{}};
 });
 $("v2Filter").onsubmit=e=>{
  e.preventDefault();const next=fields(e.currentTarget);
  if(next.inicio>next.fim){message("A data inicial deve ser anterior à final.",true);return;}
  filters=next;message();overview().catch(e=>message(e.message,true));
 };
 const params=new URLSearchParams(filters);
 const a=Date.parse(start), b=Date.parse(end), dayMs=86400000;
 const iso=t=>new Date(t).toISOString().slice(0,10);
 const previousQuery=new URLSearchParams({medico:selected,inicio:iso(a-(b-a)-dayMs),fim:iso(a-dayMs)});
 const [r,prior]=await Promise.all([api("/painel?"+params),api("/painel?"+previousQuery)]);
 if(!target.isConnected)return;
 let showAll=false;
 const pages={};
 function draw(){
  target.innerHTML=dashboard(r,prior.contagem,showAll)+'<section class="dash-card secondary-panel"><div class="dash-head"><div><div class="dash-label">Faturamento bruto</div><div class="dash-number">'+esc(money(r.total))+'</div></div><div><div class="dash-label">Valor efetivamente pago</div><strong>'+esc(money(r.pago))+'</strong></div><button class="dash-action no-print" id="printSummary">Abrir relatório de repasses</button></div>'+
  (selected?'<div class="secondary-panel"><h3>Atendimentos de '+esc(nameOf("Medicos",selected))+'</h3>'+lines(r,pages)+'</div>':'')+'</section>';
  const toggle=$("rankToggle");if(toggle)toggle.onclick=()=>{showAll=!showAll;draw();$("rankToggle").focus();};
  $("printSummary").onclick=()=>navigate("Relatório médico");
  bindPages(target,pages,draw);
  const readout=$("chartReadout");
  target.querySelectorAll("[data-month]").forEach(b=>{
   const show=()=>{readout.textContent=b.dataset.month;};
   const clear=()=>{if(readout.textContent===b.dataset.month)readout.textContent="";};
   b.onmouseenter=b.onfocus=b.onclick=show;
   b.onmouseleave=b.onblur=clear;
  });
  target.querySelectorAll("[data-doctor]").forEach(el=>el.onclick=()=>openDoctor(el.dataset.doctor));
 }
 draw();
}


api("/cadastros").then(result=>{data=result;navigate("Painel");}).catch(e=>message(e.message,true));
</script></html>
